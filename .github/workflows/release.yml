name: Release

# Сборка запускается тегом: git tag v0.1.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # mpv весит 113 МБ и в репозитории не хранится
      - name: Скачать mpv
        run: npm run fetch-mpv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run typecheck

      # Подпись делает сам electron-builder, когда в окружении есть сертификат.
      # Секретов нет — сборка выходит неподписанной, как сейчас; появятся —
      # начнёт подписываться без правок в этом файле.
      - name: Собрать и опубликовать
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Тихо неподписанный релиз опаснее явно неподписанного: если сертификат
      # задан, а подписи нет, сборка должна упасть, а не уехать людям
      - name: Проверить подпись
        if: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          Write-Host "Подпись: $($signature.Status) — $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "Установщик не подписан: $($signature.StatusMessage)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/*-setup.exe
          if-no-files-found: error
