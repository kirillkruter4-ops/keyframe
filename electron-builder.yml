appId: io.keyframe.player
productName: Keyframe
copyright: Copyright © 2026 Keyframe contributors

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

# mpv кладём рядом с приложением, а не внутрь asar: это исполняемый файл,
# запустить его из архива нельзя. В упакованном виде путь — resources/mpv/mpv.exe
extraResources:
  - from: resources/mpv
    to: mpv
    filter:
      - '**/*'
      - '!doc/**'
      - '!installer/**'
      - '!*.bat'
  - from: resources/logo.svg
    to: logo.svg
  # Иконки кнопок на превью в панели задач: Windows читает их как файлы
  - from: resources/thumbar
    to: thumbar

asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true

  # Сертификата у проекта пока нет, и подпись не выполняется: SmartScreen
  # предупредит при первом запуске. Заявка в SignPath Foundation — когда у
  # проекта появится история.
  #
  # Сам сертификат в репозиторий не попадёт никогда: electron-builder берёт его
  # из CSC_LINK (путь или base64 к .pfx) и CSC_KEY_PASSWORD. Как только эти
  # переменные появятся в окружении, сборка начнёт подписываться без правок
  # здесь — настройки ниже относятся к тому, как именно.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    # Метка времени обязательна: без неё подпись перестанет считаться
    # действительной в тот день, когда истечёт сертификат, — вместе со всеми
    # уже установленными у людей копиями
    rfc3161TimeStampServer: http://timestamp.digicert.com

# Регистрируем типы, чтобы Keyframe появился в «Открыть с помощью».
# Назначить себя программой по умолчанию Windows 10/11 приложению не позволяет —
# это делает пользователь в Параметрах, кнопка для этого есть в настройках.
fileAssociations:
  - ext: [mkv, mp4, avi, mov, webm, flv, m4v, mpg, mpeg, ts, m2ts, wmv, 3gp, ogv]
    name: Видеофайл
    description: Видео
    role: Viewer
    icon: build/icon.png
  - ext: [mp3, flac, aac, m4a, opus, ogg, wav, wma, alac, ape]
    name: Аудиофайл
    description: Аудио
    role: Viewer
    icon: build/icon.png
  - ext: [m3u, m3u8]
    name: Плейлист
    description: Плейлист
    role: Viewer
    icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Keyframe
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: Keyframe-${version}-setup.${ext}

publish:
  provider: github
  owner: kirillkruter4-ops
  repo: keyframe
