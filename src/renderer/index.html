<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      img-src с data: нужен превью кадров на таймлайне: кадр приходит из
      главного процесса строкой, а не файлом по адресу. Всё остальное
      по-прежнему только своё: сеть интерфейсу не нужна.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:"
    />
    <title>Keyframe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
